name: Verify frontend and Java

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run Node regression tests
        run: node --test in/src/test/frontend/*.test.mjs

  java:
    name: Java regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: |
            in/pom.xml
            .github/maven-settings.xml
      - name: Verify without an external database
        working-directory: in
        run: mvn --settings ../.github/maven-settings.xml --batch-mode --no-transfer-progress -DexcludedGroups=database test
