<!DOCTYPE html>
<html>
  <head>
    <title>Vivek Sushil &amp; Co - Dashboard</title>
    <div th:replace="fragments/head :: head"></div>
  </head>
  <body>
    <!-- <div th:replace="fragments/nav :: sidenav"></div> -->
    <!-- Main content -->
    <div class="main-content" id="panel">
      <div th:replace="fragments/topNav :: topNav"></div>
      <div th:replace="fragments/breadcrumb :: breadcrumb"></div>
      <div class="container-fluid mt--6">
        <!-- Page content -->
        <div th:fragment="createTask" class="row">
          <div class="col">
            <div class="card">
              <!-- Card header -->
              <div class="card-header border-0">
                <div class="row">
                  <div class="col-lg-6">
                    <h3 class="mb-0">
                      View 1 <span id="taskNameChangeHeading"></span> - <span id="recordCount"></span>
                    </h3>
                  </div>
                  <div class="col-lg-6 text-right">
                    <div
                      id="statusInlineControls"
                      class="input-group input-group-sm d-none status-inline-controls"
                      style="display: inline-flex; width: auto; margin-right: 10px;"
                    >
                      <select
                        id="headerStatusSelect"
                        class="form-control"
                      >
                        <th:block th:replace="fragments/statusOptions :: statusOptions"></th:block>
                      </select>
                      <div class="input-group-append">
                        <button
                          id="statusUpdateBtn"
                          class="btn btn-primary"
                          type="button"
                          disabled
                        >
                          Change
                        </button>
                      </div>
                    </div>
		              <button type="button" class="btn btn-default" style="float:right" onclick="resetTableHandler();">Reset Filter</button>
	              </div>
                </div>
              </div>
              <!-- Light table -->
              <div class="table-responsive">
                <table
                  id="table_id"
                  class="table align-items-center table-flush"
                >
                  <thead class="thead-light">
                    <tr>
                      <th scope="col">
                        <input type="checkbox" id="selectAllRows" />
                      </th>
                      <th scope="col" class="sort" data-sort="projectName">
                        Project Name
                      </th>
                      <th scope="col" class="sort" data-sort="partyName">
                        Party Name
                      </th>
            <th scope="col">View/Edit</th>
					  <!--  <th scope="col" class="sort" data-sort="weightage">
                        Weightage
                      </th>-->
                      <th scope="col" class="sort" data-sort="responsibility">
                        Responsibility
                      </th>
                      <th scope="col" class="sort" data-sort="execution">
                        Execution
                      </th>
                      <th scope="col" class="sort" data-sort="consulting">
                        Consulting
                      </th>
                      <th scope="col" class="sort" data-sort="intimation">
                        Intimation
                      </th>
                      <th scope="col" class="sort" data-sort="tasktype">
                        Task Type
                      </th>
                      <th scope="col" class="sort" data-sort="dueDate">
                        Due Date
                      </th>
                      <th scope="col" class="sort" data-sort="description">
                        Description
                      </th>
                      <th scope="col" class="sort" data-sort="status">
                        Status
                      </th>
                    </tr>
                  </thead>
                  <tbody id="populateGrid" class="list"></tbody>
                </table>
              </div>
              <!-- Card footer -->
              <!-- <div class="card-footer py-4">
              <nav aria-label="...">
                <ul class="pagination justify-content-end mb-0">
                  <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1">
                      <i class="fas fa-angle-left"></i>
                      <span class="sr-only">Previous</span>
                    </a>
                  </li>
                  <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" href="#">2 <span class="sr-only">(current)</span></a>
                  </li>
                  <li class="page-item"><a class="page-link" href="#">3</a></li>
                  <li class="page-item">
                    <a class="page-link" href="#">
                      <i class="fas fa-angle-right"></i>
                      <span class="sr-only">Next</span>
                    </a>
                  </li>
                </ul>
              </nav>
            </div> -->
            </div>
          </div>
        </div>

        <!-- footer -->

        <!-- Status Update Modal -->
        <div
          class="modal fade"
          id="statusUpdateModal"
          tabindex="-1"
          role="dialog"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Update Status</h5>
                <button
                  type="button"
                  class="close"
                  data-dismiss="modal"
                  aria-label="Close"
                >
                  <span aria-hidden="true">&times;</span>
                </button>
              </div>
              <div class="modal-body">
                <p id="statusUpdateSummaryText" class="mb-0">
                  You are updating status of
                  <strong><span id="statusUpdateCount"></span></strong>
                  task(s) to
                  "<strong><span id="statusUpdateStatusText"></span></strong>".
                  Do you want to continue?
                </p>
                <input type="hidden" id="statusSelect" />
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-dismiss="modal"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  id="confirmStatusUpdateBtn"
                  disabled
                >
                  Yes, Update
                </button>
              </div>
            </div>
          </div>
        </div>

        <div th:replace="fragments/footer :: dashboard-footer"></div>
      </div>
    </div>
    <!-- scripts -->
    <div th:replace="fragments/footer :: dashboard-scripts"></div>
    <script th:src="@{/logics/viewTask.js}"></script>
  </body>
</html>
